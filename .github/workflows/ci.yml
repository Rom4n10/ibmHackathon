name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          pip install -e .
          antibody --version
          antibody validate examples/sample-run/scoreboard.json --schema scoreboard
